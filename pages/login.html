<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | FormaRifa</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/componentes.css"><link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">
<main class="auth-card">
<a class="logo" href="../index.html">Forma<span>Rifa</span></a>
<h1>Entrar</h1><p>Acesse sua conta.</p>
<form id="loginForm" class="grid">
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
<div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required></div>
<button class="btn btn-primary" type="submit">Entrar</button>
</form>
<div class="auth-links"><a href="cadastro.html">Criar conta</a><a href="../index.html">Voltar</a></div>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit", e => { e.preventDefault(); alert("Integração com o backend pendente."); });
</script>
</body></html>
