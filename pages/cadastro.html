<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | FormaRifa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="logo" href="../index.html">Forma<span>Rifa</span></a>
    
    <h1>Criar conta</h1>
    <p>Cadastre um usuário para acessar a plataforma.</p>

    <form id="cadastroForm" class="grid">
      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" placeholder="Seu nome completo" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="seu@email.com" required>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="••••••••" required>
      </div>

      <div class="field">
        <label for="perfil">Perfil</label>
        <select id="perfil" name="perfil" required>
          <option value="administrador">Administrador</option>
          <option value="usuario">Usuário</option>
        </select>
      </div>

      <div class="field">
        <label for="link">Link personalizado</label>
        <input id="link" name="link" type="text" placeholder="sua-rifa">
      </div>

      <button class="btn btn-primary" type="submit">Cadastrar</button>
    </form>

    <div class="auth-links">
      <a href="login.html">Já tenho conta</a>
      <a href="../index.html">Voltar</a>
    </div>
  </main>

  <script>
    document.getElementById("cadastroForm").addEventListener("submit", e => { 
      e.preventDefault(); 
      alert("Integração com o backend pendente."); 
    });
  </script>
</body>
</html>
