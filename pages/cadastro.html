<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Look Eventos</title>

    <link rel="stylesheet" href="assets/css/cadastro.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<main class="cadastro-page">

    <section class="cadastro-banner">

        <div class="overlay"></div>

        <div class="banner-content">

            <img src="assets/images/logo.png" class="logo">

            <h1>

                Crie sua conta

            </h1>

            <p>

                Comece a vender rifas online em poucos minutos.

            </p>

        </div>

    </section>

    <section class="cadastro-container">

        <div class="cadastro-card">

            <h2>

                Cadastro

            </h2>

            <form id="cadastroForm">

                <div class="input-group">

                    <label>Nome Completo</label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            required>

                    </div>

                </div>

                <div class="input-group">

                    <label>Email</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required>

                    </div>

                </div>

                <div class="input-group">

                    <label>Senha</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            required>

                        <button
                            type="button"
                            id="toggleSenha">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="input-group">

                    <label>Confirmar Senha</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmarSenha"
                            required>

                    </div>

                </div>

                <button
                    class="cadastro-btn"
                    type="submit">

                    Criar Conta

                </button>

            </form>

            <div class="login-link">

                Já possui conta?

                <a href="login.html">

                    Entrar

                </a>

            </div>

        </div>

    </section>

</main>

<script src="assets/js/cadastro.js"></script>

</body>

</html>
